apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitstack-frontend
  labels:
    app: bitstack-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bitstack-frontend
  template:
    metadata:
      labels:
        app: bitstack-frontend
    spec:
      containers:
      - name: frontend
        image: bitstack/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_STACKS_NETWORK
          value: "mainnet"
        - name: NEXT_PUBLIC_CONTRACT_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: bitstack-config
              key: contract-address
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bitstack-frontend-service
spec:
  selector:
    app: bitstack-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bitstack-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bitstack-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
